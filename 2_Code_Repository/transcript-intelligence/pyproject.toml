[project]
name = "transcript-intelligence"
version = "1.1.0"
description = "Categorise, sentiment-score and cross-link sales, support and internal call transcripts."
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
src = ["src"]
extend-exclude = ["notebooks/*.ipynb"]   # generated by notebooks/build_notebook.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/build_notebook.py" = ["E501"]   # markdown prose cells
